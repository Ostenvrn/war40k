[project]
name = "war40k"
version = "0.1.0"
description = "Текстовая RPG по вселенной Warhammer 40,000"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Александр Чернов", email = "ostenvrn@mail.ru" }
]

dependencies = [
    "flet[all]>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/Ostenvrn/war40k"
Repository = "https://github.com/Ostenvrn/war40k"

[tool.flet]
org = "Ostenvrn"
product = "War40k"
company = "Ostenvrn"
copyright = "Copyright (C) 2026 Ostenvrn"

[tool.flet.app]
path = "src"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["core", "data", "systems", "ui", "utils"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
